name: Bump Version Action
description: 'Bump versions based on PR labels'
author: conjikidow

branding:
  icon: chevrons-up
  color: green

inputs:
  version-of-bump-my-version:
    description: 'Version of `bump-my-version` to use.'
    required: false
    default: 'latest'
  label-major:
    description: 'Label that triggers a major version bump.'
    required: false
    default: major
  label-minor:
    description: 'Label that triggers a minor version bump.'
    required: false
    default: minor
  label-patch:
    description: 'Label that triggers a patch version bump.'
    required: false
    default: patch
  manual-bump-type:
    description: 'Bump type used for manual workflow dispatch runs: `major`, `minor`, or `patch`.'
    required: false
    default: ''
  branch-prefix:
    description: 'Prefix of the version bump branch name.'
    required: false
    default: workflow
  labels-to-add:
    description: 'Labels to add to the version bump PR, separated by commas.'
    required: false
    default: ''
  auto-merge:
    description: >-
      Merge method used to enable auto-merge on the version bump PR:
      `merge`, `squash`, or `rebase`. Empty disables auto-merge.
    required: false
    default: ''
  update-major-minor-tags:
    description: 'Whether to create or update the major (`vX`) and minor (`vX.Y`) tags.'
    required: false
    default: false
  create-release:
    description: 'Whether to create a GitHub release for the new tag.'
    required: false
    default: false
  github-token:
    description: 'Token used to authenticate with GitHub. Needs `contents: write` and `pull-requests: write`.'
    required: false
    default: ${{ github.token }}

outputs:
  version-bumped:
    description: '`true` when the version was bumped and a new tag was created; otherwise `false`.'
    value: ${{ steps.set-outputs.outputs.version-bumped }}
  new-version:
    description: 'New version number (e.g. `1.2.4`). Empty when `version-bumped` is `false`.'
    value: ${{ steps.set-outputs.outputs.new-version }}
  pull-request-number:
    description: 'Number of the version bump PR. Empty when no PR was created.'
    value: ${{ steps.set-outputs.outputs.pull-request-number }}
  pull-request-url:
    description: 'URL of the version bump PR. Empty when no PR was created.'
    value: ${{ steps.set-outputs.outputs.pull-request-url }}

runs:
  using: composite

  steps:
    - name: Determine whether to run
      shell: bash
      env:
        PR_MERGED: ${{ github.event.pull_request.merged }}
      run: |
        if [[ "${GITHUB_EVENT_NAME}" == 'workflow_dispatch' ]]; then
          echo 'Manual workflow dispatch detected.'
          exit 0
        fi

        if [[ "${GITHUB_EVENT_NAME}" == 'pull_request' && \
              "${PR_MERGED}" == 'true' ]]; then
          echo 'Merged pull request detected.'
          exit 0
        fi

        if [[ "${GITHUB_EVENT_NAME}" == 'pull_request' ]]; then
          echo 'Skipping job because the pull request is not merged.'
        else
          echo "Skipping job because the event is unsupported: ${GITHUB_EVENT_NAME}"
        fi

        echo 'SKIP_JOB=true' >> "${GITHUB_ENV}"

    - name: Check out the repository
      if: env.SKIP_JOB != 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        token: ${{ inputs.github-token }}
        persist-credentials: true

    - name: Configure Git user
      if: env.SKIP_JOB != 'true'
      shell: bash
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'

    - name: Determine bump type
      id: bump-type
      if: env.SKIP_JOB != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        LABEL_MAJOR: ${{ inputs.label-major }}
        LABEL_MINOR: ${{ inputs.label-minor }}
        LABEL_PATCH: ${{ inputs.label-patch }}
        MANUAL_BUMP_TYPE: ${{ inputs.manual-bump-type }}
      run: bash "${GITHUB_ACTION_PATH}/src/determine-bump-type.sh"

    - name: Install uv
      if: >-
        env.SKIP_JOB != 'true'
        && steps.bump-type.outputs.type != 'none'
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        enable-cache: false

    - name: Bump version
      id: bump-version
      if: >-
        env.SKIP_JOB != 'true'
        && steps.bump-type.outputs.type != 'none'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
        VERSION_OF_BUMP_MY_VERSION: ${{ inputs.version-of-bump-my-version }}
        BRANCH_PREFIX: ${{ inputs.branch-prefix }}
        LABELS_TO_ADD: ${{ inputs.labels-to-add }}
        AUTO_MERGE: ${{ inputs.auto-merge }}
        BUMP_TYPE: ${{ steps.bump-type.outputs.type }}
      run: bash "${GITHUB_ACTION_PATH}/src/bump-version.sh"

    - name: Create tag
      id: create-tag
      if: >-
        env.SKIP_JOB != 'true'
        && github.event_name == 'pull_request'
        && github.event.pull_request.merged == true
      shell: bash
      env:
        PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        PR_MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        BRANCH_PREFIX: ${{ inputs.branch-prefix }}
        UPDATE_MAJOR_MINOR_TAGS: ${{ inputs.update-major-minor-tags }}
      run: bash "${GITHUB_ACTION_PATH}/src/create-tag.sh"

    - name: Create GitHub release
      if: >-
        env.SKIP_JOB != 'true'
        && github.event_name == 'pull_request'
        && github.event.pull_request.merged == true
        && inputs.create-release == 'true'
        && steps.create-tag.outputs.version-bumped == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
        PR_MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        NEW_VERSION: ${{ steps.create-tag.outputs.new-version }}
      run: bash "${GITHUB_ACTION_PATH}/src/create-release.sh"

    - name: Set outputs
      id: set-outputs
      if: env.SKIP_JOB != 'true'
      shell: bash
      env:
        PULL_REQUEST_NUMBER: ${{ steps.bump-version.outputs.pull-request-number }}
        PULL_REQUEST_URL: ${{ steps.bump-version.outputs.pull-request-url }}
        VERSION_BUMPED: ${{ steps.create-tag.outputs.version-bumped }}
        NEW_VERSION: ${{ steps.create-tag.outputs.new-version }}
      run: |
        echo "version-bumped=${VERSION_BUMPED:-false}" >> "${GITHUB_OUTPUT}"
        echo "new-version=${NEW_VERSION:-}" >> "${GITHUB_OUTPUT}"
        echo "pull-request-number=${PULL_REQUEST_NUMBER:-}" >> "${GITHUB_OUTPUT}"
        echo "pull-request-url=${PULL_REQUEST_URL:-}" >> "${GITHUB_OUTPUT}"
