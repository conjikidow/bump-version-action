name: 'Bump Version Action'
description: 'Bump versions based on PR labels'
author: 'conjikidow'

inputs:
  github-token:
    description: 'Token used to authenticate with GitHub. Needs `contents: write` and `pull-requests: write`.'
    required: false
    default: ${{ github.token }}
  version-of-bump-my-version:
    description: 'Version of `bump-my-version` to use.'
    required: false
    default: 'latest'
  label-major:
    description: 'Label that triggers a major version bump.'
    required: false
    default: 'major'
  label-minor:
    description: 'Label that triggers a minor version bump.'
    required: false
    default: 'minor'
  label-patch:
    description: 'Label that triggers a patch version bump.'
    required: false
    default: 'patch'
  manual-bump-type:
    description: 'Bump type used for manual workflow dispatch runs: `major`, `minor`, or `patch`.'
    required: false
    default: ''
  branch-prefix:
    description: 'Prefix of the version bump branch name.'
    required: false
    default: 'workflow'
  labels-to-add:
    description: 'Labels to add to the version bump pull request, separated by commas.'
    required: false
    default: ''
  update-major-minor-tags:
    description: 'Whether to create or update the major (`vX`) and minor (`vX.Y`) tags to point to the new release.'
    required: false
    default: 'false'
  create-release:
    description: 'Whether to create a GitHub Release for the new tag.'
    required: false
    default: 'false'
outputs:
  version-bumped:
    description: "`true` when the version was bumped and a new tag was created; otherwise `false`."
    value: ${{ steps.set-outputs.outputs.version-bumped }}
  new-version:
    description: "New version number (e.g. `1.2.4`). Empty when `version-bumped` is `false`."
    value: ${{ steps.set-outputs.outputs.new-version }}

runs:
  using: 'composite'
  steps:
    - name: Check execution conditions
      shell: bash
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          echo "Manual workflow dispatch detected."
          exit 0
        fi

        if [[ "${{ github.event_name }}" == "pull_request" && \
              "${{ github.event.pull_request.merged }}" == "true" ]]; then
          echo "Merged pull request detected."
          exit 0
        fi

        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          echo "Skipping job because the pull request is not merged."
        else
          echo "Skipping job because the event is unsupported: ${{ github.event_name }}"
        fi

        echo "SKIP_JOB=true" >> "$GITHUB_ENV"

    - name: Checkout repository
      if: env.SKIP_JOB != 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        token: ${{ inputs.github-token }}
        persist-credentials: true

    - name: Configure Git user
      if: env.SKIP_JOB != 'true'
      shell: bash
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: Determine bump type
      if: env.SKIP_JOB != 'true'
      id: bump-type
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        LABEL_MAJOR: ${{ inputs.label-major }}
        LABEL_MINOR: ${{ inputs.label-minor }}
        LABEL_PATCH: ${{ inputs.label-patch }}
        MANUAL_BUMP_TYPE: ${{ inputs.manual-bump-type }}
      run: ${{ github.action_path }}/src/determine-bump-type.sh

    - name: Install uv
      if: env.SKIP_JOB != 'true' && steps.bump-type.outputs.type != 'none'
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

    - name: Run bump script
      if: env.SKIP_JOB != 'true' && steps.bump-type.outputs.type != 'none'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        VERSION_OF_BUMP_MY_VERSION: ${{ inputs.version-of-bump-my-version }}
        BUMP_TYPE: ${{ steps.bump-type.outputs.type }}
        LABELS_TO_ADD: ${{ inputs.labels-to-add }}
        BRANCH_PREFIX: ${{ inputs.branch-prefix }}
      run: ${{ github.action_path }}/src/bump-version.sh

    - name: Create tag
      if: env.SKIP_JOB != 'true' && github.event_name == 'pull_request' && github.event.pull_request.merged == true
      id: create-tag
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        HEAD_REF: ${{ github.event.pull_request.head.ref }}
        MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        BRANCH_PREFIX: ${{ inputs.branch-prefix }}
        UPDATE_MAJOR_MINOR_TAGS: ${{ inputs.update-major-minor-tags }}
      run: ${{ github.action_path }}/src/create-tag.sh

    - name: Create GitHub Release
      if: >-
        env.SKIP_JOB != 'true' &&
        github.event_name == 'pull_request' &&
        github.event.pull_request.merged == true &&
        inputs.create-release == 'true' &&
        steps.create-tag.outputs.version-bumped == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        NEW_VERSION: ${{ steps.create-tag.outputs.new-version }}
        MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
      run: ${{ github.action_path }}/src/create-release.sh

    - name: Set outputs
      if: env.SKIP_JOB != 'true'
      id: set-outputs
      shell: bash
      env:
        VERSION_BUMPED: ${{ steps.create-tag.outputs.version-bumped }}
        NEW_VERSION: ${{ steps.create-tag.outputs.new-version }}
      run: |
        echo "version-bumped=${VERSION_BUMPED:-false}" >> "$GITHUB_OUTPUT"
        echo "new-version=${NEW_VERSION:-}" >> "$GITHUB_OUTPUT"

branding:
  icon: 'chevrons-up'
  color: 'green'
