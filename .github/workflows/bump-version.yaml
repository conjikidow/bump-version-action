name: Bump Version

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - major
          - minor
          - patch

permissions: {}

jobs:

  bump-version:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: conjikidow/bump-version-action@42a402616b7be8b18d7d6daf06d51b5836fe5ae0 # v4.1.0
        with:
          label-major: 'update::major'
          label-minor: 'update::minor'
          label-patch: 'update::patch'
          manual-bump-type: ${{ inputs.bump_type }}
          labels-to-add: 'automated,versioning'
          create-release: 'true'
